    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Luxury warm ambient background mesh */
        .bg-luxury-mesh {
            background: 
                radial-gradient(circle at 50% -5%, rgba(249, 115, 22, 0.16) 0%, rgba(220, 38, 38, 0.08) 38%, transparent 70%),
                radial-gradient(circle at 85% 20%, rgba(239, 68, 68, 0.07) 0%, transparent 45%),
                radial-gradient(circle at 15% 25%, rgba(251, 146, 60, 0.08) 0%, transparent 45%);
        }

        /* Premium Double-Framed Card Architecture */
        .premium-card {
            position: relative;
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 
                0 10px 30px -10px rgba(10, 10, 12, 0.07),
                0 2px 6px -1px rgba(10, 10, 12, 0.04),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.9);
        }
        .dark .premium-card {
            box-shadow: 
                0 14px 34px -10px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.07);
        }
        .premium-card:hover {
            transform: translateY(-3px) scale(1.008);
            box-shadow: 
                0 20px 38px -12px rgba(234, 88, 12, 0.16),
                0 4px 12px -2px rgba(10, 10, 12, 0.08),
                inset 0 1px 0 0 rgba(255, 255, 255, 1);
        }
        .dark .premium-card:hover {
            box-shadow: 
                0 20px 40px -12px rgba(239, 68, 68, 0.22),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
        }
        .premium-card:active {
            transform: scale(0.985);
        }

        /* ==========================================
           SPREADING FIRE & MAGMA EFFECT FOR GIGA CARD
           ========================================== */
        @property --fire-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes spinFireBorder {
            0% { --fire-angle: 0deg; }
            100% { --fire-angle: 360deg; }
        }

        @keyframes flameWave {
            0%, 100% {
                box-shadow: 
                    0 0 18px 2px rgba(239, 68, 68, 0.65),
                    0 0 36px 8px rgba(249, 115, 22, 0.45),
                    0 -6px 28px 4px rgba(220, 38, 38, 0.4),
                    0 8px 35px 4px rgba(234, 88, 12, 0.3);
                transform: translateY(0px);
            }
            33% {
                box-shadow: 
                    0 -4px 25px 5px rgba(249, 115, 22, 0.8),
                    -6px 0 42px 12px rgba(220, 38, 38, 0.55),
                    6px -8px 34px 8px rgba(251, 146, 60, 0.5),
                    0 10px 40px 6px rgba(185, 28, 28, 0.4);
            }
            66% {
                box-shadow: 
                    0 2px 28px 6px rgba(220, 38, 38, 0.85),
                    6px -4px 48px 14px rgba(249, 115, 22, 0.6),
                    -5px -10px 36px 9px rgba(250, 204, 21, 0.45),
                    0 6px 30px 5px rgba(239, 68, 68, 0.45);
            }
        }

        .giga-fire-wrapper {
            position: relative;
            border-radius: 1.35rem;
            padding: 3px;
            background: conic-gradient(
                from var(--fire-angle),
                #dc2626 0%,
                #f97316 20%,
                #fde047 35%,
                #ea580c 50%,
                #b91c1c 70%,
                #f97316 85%,
                #dc2626 100%
            );
            animation: spinFireBorder 2.6s linear infinite, flameWave 2.2s ease-in-out infinite;
            z-index: 10;
        }

        /* Spreading turbulent outer fire halo */
        .giga-fire-wrapper::before {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 1.7rem;
            background: conic-gradient(
                from var(--fire-angle),
                rgba(220, 38, 38, 0.75),
                rgba(249, 115, 22, 0.85),
                rgba(250, 204, 21, 0.6),
                rgba(239, 68, 68, 0.8),
                rgba(249, 115, 22, 0.85),
                rgba(220, 38, 38, 0.75)
            );
            filter: blur(14px);
            opacity: 0.85;
            z-index: -1;
            animation: spinFireBorder 2.6s linear infinite reverse, pulseHalo 1.4s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes pulseHalo {
            0% { transform: scale(0.98); opacity: 0.7; filter: blur(12px); }
            100% { transform: scale(1.035); opacity: 0.98; filter: blur(18px); }
        }

        /* Rising ember particle animation */
        @keyframes riseEmber {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            60% {
                opacity: 0.9;
            }
            100% {
                transform: translate(var(--tx, 0px), var(--ty, -38px)) scale(0.15);
                opacity: 0;
            }
        }
        .ember-particle {
            position: absolute;
            border-radius: 9999px;
            pointer-events: none;
            z-index: 25;
            animation: riseEmber var(--dur, 1.4s) ease-out forwards;
        }

        /* Pulse animation for live statuses */
        @keyframes softPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }
        .status-dot {
            animation: softPulse 2s infinite ease-in-out;
        }

        /* Spin animation for update icon */
        @keyframes slowSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spin-slow {
            animation: slowSpin 7s linear infinite;
        }

        @keyframes sparkFlicker {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.28) rotate(15deg); opacity: 0.85; }
        }
        .bomb-spark {
            animation: sparkFlicker 0.45s infinite ease-in-out;
            transform-origin: center;
        }
    </style>
</head>
